version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod # pinned dev tools (Makefile: make tools)
    directories: [/tools, /tools/golangci-lint]
    schedule: { interval: weekly }
    groups:
      dev-tools: { patterns: ["*"] }

